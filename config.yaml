# PremiumNumber (ADD) Miner Configuration v3.1
# Contract: 0x1805eE5F34d7434FefCFf0CA2d2383E06823E6d8
# Network: BSC Mainnet (Chain ID: 56)

# Wallet Private Key (64 hex characters, starts with 0x)
private_key: "YOUR_PRIVATE_KEY_HERE"

# Multi-wallet rotation (optional):
# private_keys: ["YOUR_KEY_1","YOUR_KEY_2"]

# PremiumNumber Contract Address (v3.1)
contract_address: "0x1805eE5F34d7434FefCFf0CA2d2383E06823E6d8"

# AddressManager Contract Address (v3.1)
address_manager: "0x78B11198268619728E4b53c642E8d68941004c11"

chain_id: 56

# RPC Nodes
rpc_url: "https://bsc-dataseed.bnbchain.org"
rpc_urls:
  - "https://bsc.rpc.blxrbdn.com"
  - "https://1rpc.io/bnb"
  - "https://binance.nodereal.io"
  - "https://bsc-mainnet.public.blastapi.io"
  - "https://bsc-dataseed.bnbchain.org"

# Gas Settings
use_network_gas: true
network_gas_multiplier: 1.0
min_gas_price_gwei: 0.01
max_gas_price_gwei: 5
gas_price_gwei: 0.05
gas_limit: 2200000

# Solver
# Options: cpu or gpu (GPU strongly recommended)
solver: gpu
gpu_device: ""
gpu_target_util: 100
gpu_batch_size: 16000000

# Mining Parameters
# Minimum trailing '8's (trailing-only: >= 9, sandwich: >= 5)
min_trailing_8s: 9
simulate_before_submit: true
auto_restart: true
log_interval: 10

# Relay Broadcast (Optional)
relay_urls:
  - "https://bsc.rpc.blxrbdn.com"
  - "https://rpc-bsc.48.club"

# Dry run (calculate without submitting)
dry_run: false
verbose_logs: false
